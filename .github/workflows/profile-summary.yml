name: GitHub Profile Trophies Generator

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Grants direct permission to write to your branch

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Profile Trophies
    steps:
      - uses: actions/checkout@v4

      # Sets up the execution environment needed for the script
      - name: Setup Deno Environment
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # Clones the original repo and runs the exact render engine locally
      - name: Compile Profile Trophies SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://github.com trophy-generator
          cd trophy-generator
          deno run --allow-net --allow-read --allow-write src/render_svg.ts --username=devpkr1 --theme=darkhub --column=6 --output=../trophy.svg

      # Secure native Git push without relying on broken marketplace plugins
      - name: Push Trophy Image to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add trophy.svg
          git diff-index --quiet HEAD || git commit -m "Update gaming profile trophies"
          git push origin main
