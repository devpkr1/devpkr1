name: GitHub Profile Summary Cards & Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Grants permissions to update your branch files

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Profile Metrics
    steps:
      - uses: actions/checkout@v4

      # Step 1: Generate your profile summary panels cleanly
      - name: Generate Status Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: devpkr1

      # Step 2: Download the trophies as a local file without push collision errors
      - name: Fetch Gaming Trophies Asset
        run: |
          curl -o trophy.svg "https://vercel.app"

      # Step 3: Securely commit and push all newly generated assets in one go
      - name: Save Assets to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff-index --quiet HEAD || git commit -m "Synchronize profile cards and trophies"
          git push origin main
