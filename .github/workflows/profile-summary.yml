name: GitHub Profile Summary Cards & Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Crucial for actions to commit SVG files back to your repo

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Profile Metrics
    steps:
      - uses: actions/checkout@v4

      # Step 1: Generate your profile summary panels
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: devpkr1

      # Step 2: Generate the custom gaming-style trophy rows (Saves as trophy.svg)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: trophy.svg
          base: "" # Disables standard dashboard headers
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: no
          # This acts exactly like the original ryo-ma script engine
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C # Shows trophies ranked C and up
