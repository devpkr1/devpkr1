name: GitHub Profile Summary Cards & Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows you to run it manually anytime

permissions:
  contents: write # Crucial for actions to commit files back to your repo

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Profile Metrics
    steps:
      - uses: actions/checkout@v4

      # Step 1: Generate your profile summary status cards 
      - name: Generate Status Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: devpkr1

      # Step 2: Generate the exact gaming trophies locally (No Vercel URLs)
      - name: Generate Gaming Trophies
        uses: soulteary/github-profile-trophy-action@v1.1.2
        with:
          username: devpkr1
          theme: darkhub
          column: 6
          output: trophy.svg
