name: GitHub Profile Summary Cards & Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Required to update images in your repository

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Profile Metrics
    steps:
      - uses: actions/checkout@v4

      # Step 1: Generate your layout summary cards cleanly
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: devpkr1

      # Step 2: Use a verified marketplace action to generate matching trophies
      - name: Generate Trophies
        uses: teoxoy/profile-readme-stats@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: trophy.svg
          include: trophies
          # Adjust theme styling to match your dark layout
          theme: flat 
