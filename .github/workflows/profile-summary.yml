name: GitHub Profile Summary Cards & Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Grants permissions to save images back to your repo

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Profile Metrics
    steps:
      # Step 1: Checkout your profile repository
      - uses: actions/checkout@v4

      # Step 2: Generate your profile summary status cards 
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: devpkr1

      # Step 3: Set up runtime engine for the trophy script
      - name: Setup Deno Environment
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # Step 4: Clone and run the script locally to bypass server errors
      - name: Compile Profile Trophies SVG
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://github.com trophy-generator
          cd trophy-generator
          deno run --allow-net --allow-read --allow-write src/render_svg.ts --username=devpkr1 --theme=flat --column=6 --output=../trophy.svg

      # Step 5: Save and push the newly generated trophy to your repo root
      - name: Commit and Push Trophy File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff-index --quiet HEAD || git commit -m "Update profile trophies svg"
          git push
