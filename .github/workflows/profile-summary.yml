name: GitHub Profile Summary Cards & Trophies

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Required to push files back to your branch

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Profile Metrics
    steps:
      - uses: actions/checkout@v4

      # Step 1: Generate your profile summary panels
      - name: Generate Status Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: devpkr1

      # Step 2: Use an isolated Node environment to fetch trophies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Run a lightweight downloader script
      - name: Build Gaming Trophies Natively
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @ryo-ma/github-profile-trophy || true
          curl -s -H "Authorization: token $GITHUB_TOKEN" "https://vercel.app" -o trophy.svg
          
          # Fallback check: If the server returns an error, construct a placeholder to avoid breaking the build
          if grep -q "503" trophy.svg || [ $(stat -c%s trophy.svg) -le 200 ]; then
            echo "Server down. Compiling via local backup runner..."
            curl -s "https://githubusercontent.com" -o trophy.svg || echo "<svg></svg>" > trophy.svg
          fi

      # Step 4: Safely commit changes
      - name: Save Assets to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff-index --quiet HEAD || git commit -m "Synchronize profile cards and trophies"
          git push origin main
