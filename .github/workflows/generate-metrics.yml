name: Ultimate Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Generate Status Cards
      - name: Generate Status Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: devpkr1

      # 2. Build Gaming Trophies natively using a pure Linux execution command
      - name: Compile Trophies Natively
        run: |
          sudo npm install -g @lhci/cli || true
          curl -sL "https://vercel.app" -o trophy.svg || true
          
          # If the fallback url fails, fetch a beautiful verified open-source layout card
          if [ ! -s trophy.svg ] || grep -q "503" trophy.svg || [ $(stat -c%s trophy.svg) -le 100 ]; then
            curl -sL "https://githubusercontent.com" -o trophy.svg
          fi

      # 3. Clean Push
      - name: Commit Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add trophy.svg
          git diff-index --quiet HEAD || git commit -m "Update profile badges"
          git push origin main
